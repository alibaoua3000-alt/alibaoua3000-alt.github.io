<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="مستخرج الفوائد">
<meta name="theme-color" content="#8a3b12">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@400;600;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<title>مستخرج الفوائد</title>
<style>
:root{
  --bg:#f6f2ea; --card:#ffffff; --card2:#fbf8f2; --text:#1f1b16; --muted:#6f675c; --line:#e7dfd1;
  --accent:#8a3b12; --accent-ink:#ffffff; --accent-soft:#f6e6d9; --gold:#b7892e; --danger:#b42318; --ok:#15803d;
  --shadow:0 1px 2px rgba(40,25,10,.05),0 6px 20px rgba(40,25,10,.06);
  --r:16px; --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  color-scheme:light;
}
[data-theme=dark]{
  --bg:#12100d; --card:#1c1915; --card2:#221e19; --text:#efe9e1; --muted:#a39886; --line:#2f2a23;
  --accent:#e08a57; --accent-ink:#2a1206; --accent-soft:#3a2416; --gold:#dcae4c; --danger:#f97066; --ok:#4ade80;
  --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font-family:"IBM Plex Sans Arabic",-apple-system,system-ui,"Geeza Pro",sans-serif;font-size:16px;line-height:1.6;
  padding:calc(var(--safe-t) + 6px) 0 calc(var(--safe-b) + 130px);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{font-size:16px}
.hidden{display:none!important}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
.top{display:flex;align-items:center;gap:10px;padding:10px 0 14px}
.top h1{font-size:23px;margin:0;font-weight:700}
.top .grow{flex:1;min-width:0}
.top .sub{color:var(--muted);font-size:13.5px}
.ellip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--shadow);border:1px solid var(--line);flex:none;font-size:19px}
.icon-btn:active{transform:scale(.94)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;margin-bottom:12px}
.section-h{display:flex;align-items:center;justify-content:space-between;margin:20px 2px 10px;font-weight:700;font-size:17px}
.section-h small{color:var(--muted);font-weight:500;font-size:13.5px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:12px;background:var(--card2);border:1px solid var(--line);font-weight:600;font-size:15px;min-height:44px;text-decoration:none;color:inherit;text-align:center}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.danger{background:var(--danger);color:#fff;border-color:transparent}
.btn.block{width:100%}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px}
.btn:active{opacity:.85}
.btn[disabled]{opacity:.45}
.row{display:flex;gap:8px;align-items:center}
.row>.btn{flex:1}
.hint{color:var(--muted);font-size:13.5px;margin:6px 0 0}
.banner{border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:14px;background:#fff4e0;color:#7a4b00;border:1px solid #f1d7a5}
.banner.err{background:#fdecea;color:#8a1c12;border-color:#f3c3bd}
[data-theme=dark] .banner{background:#2d2310;color:#f3d18e;border-color:#4a3a18}
[data-theme=dark] .banner.err{background:#3a1512;color:#fbb4ab;border-color:#5a221d}
.banner .btn{margin-top:8px}

/* add grid */
.add-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.add{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:var(--shadow);text-align:start;min-height:64px}
.add .ai{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;background:var(--accent-soft);font-size:20px;flex:none}
.add b{display:block;font-size:14.5px;line-height:1.3}
.add small{color:var(--muted);font-size:12px;line-height:1.3;display:block}
.add.wide{grid-column:1/-1}

/* book cards */
.bk{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:12px;margin-bottom:10px;cursor:pointer;position:relative;overflow:hidden}
.bk .cv{width:46px;height:58px;border-radius:6px 10px 10px 6px;display:grid;place-items:center;font-size:22px;flex:none;color:#fff;box-shadow:inset 4px 0 0 rgba(0,0,0,.18)}
.bk .mn{flex:1;min-width:0}
.bk .tt{font-weight:700;font-size:16px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bk .mt{color:var(--muted);font-size:12.5px;margin-top:2px}
.badges{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.bdg{font-size:11.5px;padding:1px 7px;border-radius:10px;background:var(--card2);border:1px solid var(--line);color:var(--muted)}
.bdg.run{background:var(--accent-soft);color:var(--accent);border-color:transparent;font-weight:600}
.bdg.err{background:#fdecea;color:#8a1c12;border-color:transparent}

/* services */
.svc-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.svc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:var(--shadow);text-align:start;display:flex;flex-direction:column;gap:2px;min-height:96px;position:relative}
.svc .si{font-size:22px}
.svc b{font-size:14.5px;line-height:1.35}
.svc small{color:var(--muted);font-size:12px;line-height:1.35}
.svc .st{margin-top:auto;font-size:12px;font-weight:600;color:var(--accent)}
.svc .st.done{color:var(--ok)}
.svc.wide{grid-column:1/-1;flex-direction:row;align-items:center;gap:12px;min-height:64px}
.svc.wide .si{font-size:26px}

/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--card);border-radius:20px 20px 0 0;max-height:88vh;overflow:auto;padding:8px 18px calc(var(--safe-b) + 18px);max-width:720px;margin:0 auto;box-shadow:0 -10px 30px rgba(0,0,0,.15);-webkit-overflow-scrolling:touch}
.sheet .grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.sheet h3{margin:4px 0 8px;font-size:18px}
.sheet-actions{display:flex;gap:8px;margin-top:14px}
.sheet-actions .btn{flex:1}
.fld{display:block;margin:10px 0}
.fld>span{display:block;font-size:13.5px;color:var(--muted);margin-bottom:4px;font-weight:500}
.fld input,.fld textarea,.fld select{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card2);outline:none}
.fld textarea{resize:vertical;line-height:1.6}
.fld input:focus,.fld textarea:focus{border-color:var(--accent)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.set-row{margin:12px 0}
.set-row .lab{font-size:13.5px;color:var(--muted);margin-bottom:6px;font-weight:500}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card2);font-size:14px;font-weight:500}
.seg button.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.menu-item{display:flex;align-items:center;gap:12px;width:100%;padding:13px 4px;border-bottom:1px solid var(--line);font-size:15.5px;text-align:start}
.menu-item:last-child{border-bottom:0}
.menu-item.danger{color:var(--danger)}
.step{display:flex;gap:10px;margin:10px 0;font-size:14.5px}
.step>b{width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:13px;flex:none}
.step .btn{margin-top:8px;width:100%}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(var(--safe-b) + 24px);transform:translate(-50%,30px);background:#1f1b16;color:#fff;padding:10px 16px;border-radius:12px;font-size:14.5px;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* run bar */
.runbar{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:0 12px calc(var(--safe-b) + 10px)}
.runbar .in{max-width:696px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,.18);padding:12px 14px}
.runbar .h{display:flex;align-items:center;gap:10px}
.runbar .h b{flex:1;min-width:0;font-size:14.5px}
.runbar .m{font-size:13px;color:var(--muted);margin:4px 0 8px}
.bar{height:7px;border-radius:6px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:6px;transition:width .4s}
.spin{width:18px;height:18px;border:2.5px solid var(--accent-soft);border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}

/* results */
.chips{display:flex;gap:6px;margin:4px 0 10px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{padding:6px 12px;border-radius:20px;background:var(--card);border:1px solid var(--line);font-size:13.5px;white-space:nowrap;font-weight:500;flex:none}
.chip.on{background:var(--text);color:var(--bg);border-color:transparent}
.search{width:100%;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);margin-bottom:10px;outline:none}
.it{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;position:relative;cursor:pointer}
.it .tx{white-space:pre-line;font-family:"Noto Naskh Arabic","IBM Plex Sans Arabic",serif;font-size:17px;line-height:1.85}
.it .ft{display:flex;align-items:center;gap:6px;margin-top:6px;flex-wrap:wrap}
.pg{font-size:12px;color:var(--muted);background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:0 7px}
.ntag{font-size:12px;border:1px solid;border-radius:8px;padding:0 7px;font-weight:600}
.star{position:absolute;top:8px;left:10px;font-size:15px}
.sec-title{font-size:12px;color:var(--muted)}
.grp-h{display:flex;align-items:center;gap:8px;margin:18px 2px 8px;font-weight:700;font-size:16px}
.grp-h i{flex:1;height:1px;background:var(--line)}
.overall{background:var(--accent-soft);border:1px solid transparent;border-radius:14px;padding:14px;margin-bottom:12px;white-space:pre-line;font-family:"Noto Naskh Arabic",serif;font-size:16.5px;line-height:1.9}
.overall h4{margin:0 0 6px;font-family:"IBM Plex Sans Arabic",sans-serif;font-size:15px;color:var(--accent)}
.sum h4{margin:0 0 4px;font-size:16px;color:var(--accent)}
.tree-n{display:flex;gap:8px;align-items:flex-start;padding:5px 0;border-bottom:1px dashed var(--line);cursor:pointer}
.tree-n .dot{width:9px;height:9px;border-radius:50%;margin-top:10px;flex:none}
.tree-n .t{flex:1;font-size:15.5px}
.tree-n.l1 .t{font-weight:700;font-size:17px}
.tree-n.l2 .t{font-weight:600}
.qa .q{font-weight:700;font-size:16px}
.qa .a{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-family:"Noto Naskh Arabic",serif;font-size:16.5px;white-space:pre-line}
.qa.closed .a{display:none}
.qa .rv{font-size:12.5px;color:var(--accent);margin-top:6px}
.qa:not(.closed) .rv{display:none}
.flash{min-height:260px;display:flex;flex-direction:column;justify-content:center;text-align:center;padding:24px 18px}
.flash .q{font-size:19px;font-weight:700}
.flash .a{margin-top:16px;font-family:"Noto Naskh Arabic",serif;font-size:18px;white-space:pre-line;color:var(--accent)}
.chat .msg{border-radius:14px;padding:10px 14px;margin-bottom:10px;font-size:15.5px;white-space:pre-line}
.chat .me{background:var(--accent);color:var(--accent-ink);margin-inline-start:40px}
.chat .ai{background:var(--card);border:1px solid var(--line);margin-inline-end:20px;font-family:"Noto Naskh Arabic",serif;font-size:16.5px;line-height:1.9}
.askbox{position:sticky;bottom:calc(var(--safe-b) + 8px);display:flex;gap:8px;background:var(--bg);padding:8px 0}
.askbox textarea{flex:1;padding:10px 12px;border-radius:14px;border:1px solid var(--line);background:var(--card);resize:none;outline:none;min-height:46px;max-height:140px}
.empty{text-align:center;padding:26px 12px;color:var(--muted)}
.steps{text-align:start;margin:12px 0 0;padding:0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:10px;margin-bottom:9px;font-size:14.5px;color:var(--text)}
.steps li::before{content:counter(s);width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:12.5px;font-weight:700;flex:none}
.chk{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line);font-size:15px}
.chk input{width:20px;height:20px;accent-color:var(--accent)}
.chk small{color:var(--muted);margin-inline-start:auto}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px;margin-top:10px}
.thumbs img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:8px;border:1px solid var(--line)}

/* ===== print / PDF ===== */
#print{display:none}
@page{size:A4;margin:16mm 15mm 16mm 15mm}
@media print{
  html,body{background:#fff!important;color:#000}
  body{padding:0!important}
  body>*:not(#print){display:none!important}
  #print{display:block!important}
}
.doc{font-family:"Noto Naskh Arabic","Amiri","Traditional Arabic",serif;color:#1a1a1a;font-size:13.5pt;line-height:1.9;direction:rtl}
.doc .cover{min-height:255mm;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;border:3px double #8a3b12;padding:20mm 14mm;page-break-after:always;break-after:page}
.doc .cover .bas{font-family:"Amiri",serif;font-size:17pt;color:#8a3b12;margin-bottom:18mm}
.doc .cover h1{font-family:"Amiri",serif;font-size:30pt;margin:0 0 6mm;color:#5a2408;line-height:1.5}
.doc .cover .au{font-size:15pt;margin-bottom:10mm}
.doc .cover .what{font-size:13pt;color:#444;max-width:140mm}
.doc .cover .by{margin-top:22mm;font-size:15pt}
.doc .cover .by b{color:#8a3b12}
.doc .cover .dt{margin-top:6mm;font-size:11.5pt;color:#555}
.doc .cover .note{margin-top:16mm;font-size:10pt;color:#777;max-width:140mm;border-top:1px solid #ddd;padding-top:4mm}
.doc .toc{page-break-after:always;break-after:page}
.doc .toc h2,.doc h2{font-family:"Amiri",serif;font-size:21pt;color:#5a2408;border-bottom:2px solid #8a3b12;padding-bottom:2mm;margin:0 0 6mm}
.doc .toc ol{font-size:14pt;line-height:2.2}
.doc .part{page-break-before:always;break-before:page}
.doc .part.first{page-break-before:auto;break-before:auto}
.doc h3{font-size:15pt;margin:7mm 0 3mm;padding:1.5mm 4mm;border-inline-start:5px solid #8a3b12;background:#f7efe7;break-after:avoid;page-break-after:avoid}
.doc .ov{background:#f7efe7;border:1px solid #e3cdb8;border-radius:3mm;padding:4mm 6mm;margin-bottom:6mm;white-space:pre-line}
.doc .itm{margin:0 0 3mm;break-inside:avoid;page-break-inside:avoid;white-space:pre-line}
.doc .itm .n{font-weight:700;color:#8a3b12;margin-inline-end:2mm}
.doc .ref{font-size:10pt;color:#777;white-space:nowrap;font-family:"IBM Plex Sans Arabic",sans-serif}
.doc .tg{font-size:10pt;font-weight:700;border:1px solid;border-radius:2mm;padding:0 2mm;margin-inline-end:2mm;font-family:"IBM Plex Sans Arabic",sans-serif}
.doc .sumb{margin-bottom:5mm;break-inside:avoid-page}
.doc .sumb h4{margin:0 0 1mm;font-size:14pt;color:#5a2408}
.doc .sumb div{white-space:pre-line}
.doc .tr{margin:0;padding:.6mm 0;break-inside:avoid}
.doc .tr.l1{font-weight:700;font-size:14.5pt;color:#5a2408;margin-top:3mm}
.doc .tr.l2{font-weight:700}
.doc .qq{font-weight:700}
.doc .qa{margin-bottom:4mm;break-inside:avoid;page-break-inside:avoid}
.doc .qa .an{white-space:pre-line;padding-inline-start:6mm}
.doc .end{text-align:center;margin-top:12mm;font-family:"Amiri",serif;font-size:15pt;color:#5a2408}
</style>
</head>
<body>
<div id="app" class="wrap"></div>
<div id="runbar" class="runbar hidden"></div>
<div id="sheetBg" class="sheet-bg hidden" data-act="sheetNo"></div>
<div id="sheet" class="sheet hidden"></div>
<div id="toast" class="toast"></div>
<div id="print"></div>
<input type="file" id="fPdf" accept="application/pdf,.pdf" hidden>
<input type="file" id="fDoc" accept=".docx,.txt,.md,.text,application/vnd.openxmlformats-officedocument.wordprocessingml.document,text/plain" hidden>
<input type="file" id="fImg" accept="image/*" multiple hidden>
<input type="file" id="fBak" accept="application/json,.json" hidden>
<script>
'use strict';
/* ================= أدوات عامة ================= */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const toInt = v => { if (v == null || v === '') return null; const n = parseInt(String(v).replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[^\d]/g, ''), 10); return isNaN(n) ? null : n; };
const sleep = (ms, signal) => new Promise((res, rej) => {
  if (signal && signal.aborted) { rej(new AiError('أُلغي.', 'abort')); return; }
  const t = setTimeout(res, ms);
  if (signal) signal.addEventListener('abort', () => { clearTimeout(t); rej(new AiError('أُلغي.', 'abort')); }, { once: true });
});
class AiError extends Error { constructor(msg, code) { super(msg); this.code = code; } }
let toastT = null;
function toast(m, ms) { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), ms || 2600); }
function copyText(t, msg) {
  const ok = () => toast(msg || 'نُسخ ✓');
  const fb = () => { const ta = document.createElement('textarea'); ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.focus(); ta.select(); try { document.execCommand('copy'); ok(); } catch (e) { toast('تعذّر النسخ'); } ta.remove(); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(ok, fb); else fb();
}
const stripTashkeel = s => String(s || '').replace(/[ً-ٰٟۖ-ۭـ]/g, '');
const normAr = s => stripTashkeel(s).replace(/[إأآٱ]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه').replace(/\s+/g, ' ').trim();

/* ================= التخزين ================= */
const DB = {
  p: null,
  open() {
    return this.p || (this.p = new Promise((res, rej) => {
      const r = indexedDB.open('mustakhrij_fawaid', 1);
      r.onupgradeneeded = () => { const d = r.result; d.createObjectStore('books', { keyPath: 'id' }); d.createObjectStore('blobs'); };
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    }));
  },
  async tx(store, mode, fn) {
    const d = await this.open();
    return new Promise((res, rej) => {
      const t = d.transaction(store, mode), s = t.objectStore(store); let out;
      const q = fn(s); if (q) q.onsuccess = () => { out = q.result; };
      t.oncomplete = () => res(out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
    });
  },
  all() { return this.tx('books', 'readonly', s => s.getAll()); },
  put(b) { return this.tx('books', 'readwrite', s => s.put(b)); },

const MODELS = () => [ST.model, 'gemini-flash-latest', 'gemini-2.5-flash', 'gemini-flash-lite-latest', 'gemini-2.5-flash-lite'].filter((v, i, a) => v && a.indexOf(v) === i);
async function gemini(model, parts, o) {
  const key = (ST.key || '').trim();
  if (!key) throw new AiError('أضف مفتاح Gemini أولًا من الإعدادات ⚙️، أو استعمل طريقة «تطبيق Gemini».', 'nokey');
  const body = { contents: [{ role: 'user', parts }], generationConfig: { temperature: 0.3, maxOutputTokens: o.maxTokens || 32768 } };
  if (o.json && !o.tools) body.generationConfig.responseMimeType = 'application/json';
  if (o.tools) body.tools = [{ url_context: {} }];
  let r, j = null;
  try {
    r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(key)}`,
      { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body), signal: o.signal });
  } catch (e) {
    if (o.signal && o.signal.aborted) throw new AiError('أُلغي.', 'abort');
    throw new AiError('تعذّر الاتصال بخدمة Gemini. تحقّق من الإنترنت.', 'net');
  }
  try { j = await r.json(); } catch (e) {}
  const msg = (j && j.error && j.error.message) || '';
  if (r.status === 404) throw new AiError('النموذج غير متاح: ' + model, 'model');
  if (!r.ok) {
    if (/api key/i.test(msg) || r.status === 401) throw new AiError('مفتاح Gemini غير صالح. راجعه في الإعدادات ⚙️.', 'key');
    if (r.status === 403) throw new AiError('المفتاح مرفوض أو غير مفعّل. راجعه في الإعدادات ⚙️.', 'key');
    if (r.status === 429) throw new AiError('بلغتَ الحدّ المجاني المؤقت.', 'quota');
    if (r.status === 413 || /too large|exceeds|payload size|request size/i.test(msg)) throw new AiError('الجزء كبير جدًا.', 'toolarge');
    if (r.status >= 500) { const e = new AiError('خدمة Gemini مشغولة الآن.', 'busy'); e.detail = msg; throw e; }
    if (o.tools && /url|tool/i.test(msg)) throw new AiError('هذا النموذج لا يفتح الروابط: ' + model, 'model');
    throw new AiError('تعذّرت المعالجة' + (msg ? ': ' + msg.slice(0, 200) : '.'), 'bad');
  }
  const cand = j && j.candidates && j.candidates[0];
  if (!cand) {
    if (j && j.promptFeedback && j.promptFeedback.blockReason) throw new AiError('رفض Gemini معالجة هذا المحتوى (' + j.promptFeedback.blockReason + ').', 'blocked');
    throw new AiError('لم يُرجِع Gemini نتيجة.', 'empty');
  }
  const txt = ((cand.content && cand.content.parts) || []).filter(p => !p.thought).map(p => p.text || '').join('');
  if (o.tools) {
    const um = cand.urlContextMetadata || cand.url_context_metadata;
    const list = um && (um.urlMetadata || um.url_metadata);
    if (list && list.length && list.every(u => !/SUCCESS/.test(u.urlRetrievalStatus || u.url_retrieval_status || ''))) throw new AiError('لم يستطع Gemini فتح الرابط. تأكد أنه رابط عام يفتح دون تسجيل دخول، أو استعمل طريقة «تطبيق Gemini».', 'url');
  }
  if (!txt.trim()) {
    if (cand.finishReason === 'RECITATION') throw new AiError('توقّف Gemini لأن النص منقول حرفيًا.', 'recitation');
    if (cand.finishReason === 'SAFETY') throw new AiError('رفض Gemini معالجة هذا الجزء.', 'blocked');
    throw new AiError('لم يُرجِع Gemini نتيجة' + (cand.finishReason ? ' (' + cand.finishReason + ')' : '') + '.', 'empty');
  }
  return { txt, finish: cand.finishReason };
}
// إعادة المحاولة عند الانشغال، والانتقال بين النماذج
async function aiTry(build, say, signal) {
  const models = MODELS(); let last = null, soft = false, sawBusy = false, sawQuota = false;
  for (let mi = 0; mi < models.length; mi++) {
    for (let at = 0; at < 3; at++) {
      if (at) {
        const q = last && last.code === 'quota';
        say(q ? 'بلغ الحدّ المؤقت، أنتظر قليلًا ثم أكمل…' : 'Gemini مشغول، أعيد المحاولة…');
        await sleep(q ? 45000 : (at === 1 ? 4000 : 10000), signal);
      }
      try { return await build(models[mi], soft); }
      catch (e) {
        last = e;
        if (e.code === 'abort') throw e;
        if (e.code === 'busy') { sawBusy = true; continue; }
        if (e.code === 'empty' || e.code === 'parse' || e.code === 'net') continue;
        if (e.code === 'recitation') { if (!soft) { soft = true; continue; } throw e; }
        if (e.code === 'quota') { sawQuota = true; if (at < 1) continue; break; }
        if (e.code === 'model') break;
        throw e;
      }
    }
    if (mi + 1 < models.length) say('أجرّب نموذجًا آخر من Gemini…');
  }
  if (sawQuota) throw new AiError('بلغتَ الحدّ المجاني المؤقت. انتظر قليلًا ثم اضغط «استكمال»، أو استعمل طريقة «تطبيق Gemini».', 'quota');
  if (sawBusy) throw new AiError('خدمة Gemini مشغولة الآن رغم إعادة المحاولة. اضغط «استكمال» بعد قليل، أو استعمل طريقة «تطبيق Gemini».', 'busy');
  throw last || new AiError('تعذّر الاستخراج.', 'x');
}
function looseJSON(t) {
  t = String(t || '').trim().replace(/^```(?:json)?\s*/i, '').replace(/\s*```\s*$/, '');
  try { return JSON.parse(t); } catch (e) {}
  const s = t.indexOf('{'), e = t.lastIndexOf('}');
  if (s >= 0 && e > s) { try { return JSON.parse(t.slice(s, e + 1)); } catch (er) {} }
  const a = t.indexOf('['), z = t.lastIndexOf(']');
  if (a >= 0 && z > a && (s < 0 || a < s)) { try { return { items: JSON.parse(t.slice(a, z + 1)) }; } catch (er) {} }
  // رد مقطوع: نحتفظ بما اكتمل من العناصر
  if (s >= 0) {
    const body = t.slice(s); let k = body.length, n = 0;
    while ((k = body.lastIndexOf('}', k - 1)) > 0 && n++ < 60) {
      for (const tail of [']}', ']}}']) { try { return JSON.parse(body.slice(0, k + 1) + tail); } catch (er) {} }
    }
  }
  return null;
}

let PDFC = null; // { id, doc }
async function pdfDoc(b) {
  await need('pdflib');
  if (!PDFC || PDFC.id !== b.id) {
    const buf = await DB.getBlob(b.id + ':file');
    if (!buf) throw new AiError('لم أجد ملف الكتاب في الهاتف. احذفه وأضفه من جديد.', 'nofile');
    PDFC = { id: b.id, doc: await PDFLib.PDFDocument.load(buf, { ignoreEncryption: true, updateMetadata: false }) };
  }
  return PDFC.doc;
}
async function pdfChunk(b, a, z) {
  const src = await pdfDoc(b);
  const out = await PDFLib.PDFDocument.create();
  const idx = []; for (let i = a; i <= z; i++) idx.push(i - 1);
  (await out.copyPages(src, idx)).forEach(p => out.addPage(p));
  const bytes = await out.save({ useObjectStreams: true });
  if (bytes.length > 15e6) throw new AiError('الجزء كبير جدًا.', 'toolarge');
  return b64(bytes);
}
function splitPages(text, size) {
  size = size || 1500;
  text = String(text || '').replace(/\r/g, '').replace(/[ \t]+\n/g, '\n').replace(/\n{3,}/g, '\n\n').trim();
  const out = []; let i = 0;
  while (i < text.length) {
    let j = Math.min(text.length, i + size);
    if (j < text.length) { const k = text.lastIndexOf('\n', j); if (k > i + size * 0.6) j = k; else { const k2 = text.lastIndexOf(' ', j); if (k2 > i + size * 0.6) j = k2; } }
    const s = text.slice(i, j).trim(); if (s) out.push(s); i = j;
  }
  return out;
}

async function startRun(b, svc, o) {

          const j = looseJSON(txt); if (!j) throw new AiError('وصلت نتيجة غير مفهومة.', 'parse');

}

    ${ST.author ? `<div class="by">استخراج وترتيب<br><b>${esc(ST.author)}</b></div>` : ''}<div class="dt">${hijri()}${hijri() ? ' — ' : ''}${new Date().toLocaleDateString('ar-DZ', { day: 'numeric', month: 'long', year: 'numeric' })}</div>

      if (b.overall && !o.star) h += `<div class="ov"><b>الخلاصة الجامعة:</b>\n${esc(b.overall)}</div>`;
      h += items.map(x => `<div class="sumb">${x.title ? `<h4>${esc(x.title)}${ref(x)}</h4>` : ''}<div>${esc(x.text)}${x.title ? '' : ref(x)}</div></div>`).join('');

  goAsk: () => go('ask', curB().id),
  askRange: () => { const b = curB(); const r = b.askR || b.range || { a: 1, z: b.pages || 1 }; openSheet(`<h3>نطاق البحث</h3><div class="two"><label class="fld"><span>من ${unitOf(b)}</span><input id="aA" type="number" inputmode="numeric" value="${r.a}"></label><label class="fld"><span>إلى ${unitOf(b)}</span><input id="aZ" type="number" inputmode="numeric" value="${r.z}"></label></div><p class="hint">${b.kind === 'pdf' ? 'حتى 400 صفحة في السؤال الواحد.' : b.kind === 'shamela' ? 'حتى 20 صفحة في السؤال الواحد.' : 'حتى 40 صورة.'}</p><div class="sheet-actions"><button class="btn primary" data-act="askRangeSave">حفظ</button></div>`); },
  askRangeSave: async () => { const b = curB(); b.askR = readRange(b, '#aA', '#aZ'); await save(b); closeSheet(); render(); },
  askGo: async () => {
    const b = curB(), q = $('#askIn').value.trim(); if (!q) return;
    if (!ST.key) { toast('أضف مفتاح Gemini أولًا من الإعدادات'); return; }
    ASK = new AbortController(); ASKQ = q; b.chat = b.chat || []; const pendQ = q; render(); window.scrollTo(0, document.body.scrollHeight);
    try { const a = await askBook(b, pendQ); b.chat.push({ q: pendQ, a, t: Date.now() }); await save(b); }
    catch (e) { if (e.code !== 'abort') toast(e.message, 5000); }
    ASK = null; if (view.name === 'ask') { render(); window.scrollTo(0, document.body.scrollHeight); }
  },
  askStop: () => { if (ASK) ASK.abort(); },
  clearChat: async () => { const b = curB(); b.chat = []; await save(b); render(); },
  ansMenu: d => { const b = curB(), m = b.chat[+d.i]; openSheet(`<h3>الجواب</h3><p class="hint">${esc(m.q)}</p><button class="menu-item" data-act="ansCopy" data-i="${d.i}">📋 نسخ الجواب</button><button class="menu-item" data-act="ansSave" data-i="${d.i}">💡 حفظه في الفوائد</button><button class="menu-item danger" data-act="ansDel" data-i="${d.i}">🗑 حذف</button>`); },
  ansCopy: d => { const m = curB().chat[+d.i]; copyText(m.q + '\n\n' + m.a); closeSheet(); },
  ansSave: async d => { const b = curB(), m = b.chat[+d.i]; const pg = toInt((m.a.match(/\((?:ص|مقطع)\s*([\d٠-٩]+)/) || [])[1]); b.res.fawaid = (b.res.fawaid || []).concat([{ id: uid(), p: pg, type: 'مسألة', sec: '', text: m.q + '\n' + m.a.replace(/\n\n\(بحثتُ[\s\S]*$/, ''), star: true }]); sortRes(b, 'fawaid'); await save(b); closeSheet(); toast('حُفظ في الفوائد ⭐'); },
  ansDel: async d => { const b = curB(); b.chat.splice(+d.i, 1); await save(b); closeSheet(); render(); },
  cards: () => go('cards', curB().id),
  flip: () => { if (!VS.show) { VS.show = true; render(); } },
  cardAns: d => { if (d.v === '1') VS.ok++; else { VS.no++; (VS.missed = VS.missed || []).push(VS.order[VS.i]); } VS.i++; VS.show = false; render(); },
  cardsAgain: () => { VS = {}; render(); },
  cardsMissed: () => { const m = VS.missed; VS = { order: m.sort(() => Math.random() - .5), i: 0, ok: 0, no: 0, show: false }; render(); },
  theme: (d, el) => { ST.theme = d.v; saveST(); applyTheme(); el.parentNode.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === el)); },
  pasteKey: async () => { try { $('#kIn').value = (await navigator.clipboard.readText()).trim(); } catch (e) { toast('اضغط مطوّلًا في الخانة واختر «لصق»'); } },
  testKey: async () => { const k = $('#kIn').value.trim(); if (!k) { toast('الصق المفتاح أولًا'); return; } toast('يختبر…'); try { const r = await fetch('https://generativelanguage.googleapis.com/v1beta/models?pageSize=1&key=' + encodeURIComponent(k)); toast(r.ok ? 'المفتاح يعمل ✓' : 'المفتاح لا يعمل ✗'); } catch (e) { toast('تعذّر الاتصال'); } },
  saveSet: () => { ST.key = $('#kIn').value.trim(); ST.model = $('#mIn').value.trim() || 'gemini-flash-latest'; ST.author = $('#auIn').value.trim(); saveST(); closeSheet(); render(); toast('حُفظ ✓'); },
  backup: () => { const data = JSON.stringify({ app: 'mustakhrij', v: 1, at: Date.now(), books: BOOKS }); shareOrDownload(new Blob([data], { type: 'application/json' }), 'نسخة-مستخرج-الفوائد-' + new Date().toISOString().slice(0, 10) + '.json'); }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const f = ACT[el.dataset.act]; if (!f) return;
  if (el.tagName === 'A' && el.dataset.act !== 'appCopy') return;
  try { const r = f(el.dataset, el, e); if (r && r.catch) r.catch(err => toast(err.message || 'حدث خطأ')); } catch (err) { toast(err.message || 'حدث خطأ'); console.error(err); }
});
document.addEventListener('input', e => {
  const k = e.target.dataset && e.target.dataset.inp; if (!k) return;
  VS.q = e.target.value; if (k === 'gq') paintSearch(); else paintList();
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && e.target.id === 'askIn') { e.preventDefault(); ACT.askGo(); } });
$('#fPdf').addEventListener('change', e => onPdf(e.target.files[0]));
$('#fDoc').addEventListener('change', e => onDoc(e.target.files[0]));
$('#fImg').addEventListener('change', e => onImgs(e.target.files));
$('#fBak').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  try { const j = JSON.parse(await f.text()); if (!j || !Array.isArray(j.books)) throw 0; let n = 0; for (const b of j.books) { const old = B(b.id); if (old) Object.assign(old, b); else BOOKS.push(b); await DB.put(b); n++; } BOOKS.sort((a, z) => (z.created || 0) - (a.created || 0)); closeSheet(); render(); toast(`استُرجع ${n} مصدر ✓`); }
  catch (er) { toast('ملف النسخة غير صالح'); }
});
matchMedia('(prefers-color-scheme: dark)').addEventListener && matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);

/* ================= البدء ================= */
(async function init() {
  applyTheme();
  try { BOOKS = (await DB.all()) || []; } catch (e) { BOOKS = []; toast('تعذّر فتح التخزين في هذا المتصفح'); }
  BOOKS.forEach(b => { b.runs = b.runs || {}; b.res = b.res || {}; Object.values(b.runs).forEach(r => { if (r.status === 'running') r.status = 'paused'; }); });
  BOOKS.sort((a, z) => (z.created || 0) - (a.created || 0));
  render();
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
})();
</script>
</body>
</html>
