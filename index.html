<title>مكتبتي الصوتية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f3ee; --card:#ffffff; --card2:#faf9f6; --text:#1b1f1e; --muted:#69716e; --line:#e5e1d8;
  --accent:#0f766e; --accent-ink:#ffffff; --accent-soft:#e2f0ed; --gold:#b7892e; --danger:#b42318;
  --shadow:0 1px 2px rgba(20,30,28,.05),0 6px 20px rgba(20,30,28,.06);
  --r:16px; --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  color-scheme:light;
}
[data-theme=dark]{
  --bg:#0d1211; --card:#161d1c; --card2:#1b2423; --text:#eaeeed; --muted:#93a09c; --line:#26302e;
  --accent:#2fb3a2; --accent-ink:#06201d; --accent-soft:#163230; --gold:#dcae4c; --danger:#f97066;
  --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font-family:"IBM Plex Sans Arabic",-apple-system,system-ui,"Geeza Pro",sans-serif;font-size:16px;line-height:1.55;
  padding:calc(var(--safe-t) + 6px) 0 calc(var(--safe-b) + 150px);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{font-size:16px}
img{display:block}
.hidden{display:none!important}
.wrap{max-width:680px;margin:0 auto;padding:0 16px}
.ic{flex:none;display:block}

/* header */
.top{display:flex;align-items:center;gap:10px;padding:10px 0 14px}
.top h1{font-size:24px;margin:0;font-weight:700;letter-spacing:0}
.top .grow{flex:1;min-width:0}
.top .sub{color:var(--muted);font-size:14px}
.t-ellip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:var(--text);background:var(--card);box-shadow:var(--shadow);border:1px solid var(--line);flex:none}
.icon-btn.sm{width:36px;height:36px;background:transparent;box-shadow:none;border:0;color:var(--muted)}
.icon-btn:active{transform:scale(.94)}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;margin-bottom:14px}
.section-h{display:flex;align-items:center;justify-content:space-between;margin:22px 2px 10px;font-weight:700;font-size:17px}
.section-h small{color:var(--muted);font-weight:500;font-size:14px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:12px;background:var(--card2);border:1px solid var(--line);font-weight:600;font-size:15px;min-height:44px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.danger{background:var(--danger);color:#fff;border-color:transparent}
.btn.block{width:100%}
.btn:active{opacity:.85}
.hint{color:var(--muted);font-size:13.5px;margin:6px 0 0}

/* banners */
.banner{border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:14px;background:#fff4e0;color:#7a4b00;border:1px solid #f1d7a5}
[data-theme=dark] .banner{background:#2d2310;color:#f3d18e;border-color:#4a3a18}

/* continue */
.cont{display:flex;gap:12px;align-items:center;cursor:pointer}
.cont .th{width:110px;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:var(--line);flex:none;position:relative}
.cont .th img{width:100%;height:100%;object-fit:cover}
.cont .meta{flex:1;min-width:0}
.cont .lbl{font-size:12.5px;color:var(--accent);font-weight:700}
.cont .tt{font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:15px}
.cont .ss{font-size:13px;color:var(--muted)}
.play-fab{width:48px;height:48px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}

/* stats */
.stats{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr;gap:8px;align-items:center;text-align:center}
.stats .goal{display:flex;align-items:center;gap:10px;text-align:start}
.ring{--p:0;width:50px;height:50px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--line) 0)}
.ring::after{content:"";width:38px;height:38px;border-radius:50%;background:var(--card)}
.stats b{display:block;font-size:17px;line-height:1.2}
.stats small{color:var(--muted);font-size:12px;line-height:1.3;display:block}
.goal-done{color:var(--accent)}

.shortcuts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
.shortcut{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:var(--shadow);text-align:start}
.shortcut .si{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.shortcut b{display:block;font-size:15px}
.shortcut small{color:var(--muted);font-size:12.5px}

/* series cards */
.series-card{display:flex;gap:12px;align-items:stretch;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:12px;margin-bottom:10px;cursor:pointer;position:relative;overflow:hidden}
.series-card .stripe{position:absolute;inset-inline-start:0;top:0;bottom:0;width:5px}
.series-card .main{flex:1;min-width:0;padding-inline-start:4px}
.series-card .ttl{font-weight:700;font-size:16.5px}
.series-card .mt{color:var(--muted);font-size:13px;margin:2px 0 6px}
.series-card .nx{color:var(--muted);font-size:13px;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.series-card .th{width:92px;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:var(--line);align-self:center;flex:none}
.series-card .th img{width:100%;height:100%;object-fit:cover}
.bar{height:6px;border-radius:6px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;background:var(--accent)}

.empty{text-align:center;padding:30px 18px}
.empty .big{width:76px;height:76px;margin:0 auto 12px;border-radius:22px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.empty h2{margin:0 0 6px;font-size:20px}
.empty p{color:var(--muted);margin:0 0 16px}
.steps{text-align:start;margin:14px 0 18px;padding:0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:10px;margin-bottom:10px;font-size:15px}
.steps li::before{content:counter(s);width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:13px;font-weight:700;flex:none}

/* series view */
.s-head .row{display:flex;gap:8px;margin-top:12px}
.s-head .row .btn{flex:1}
.s-head .nums{display:flex;justify-content:space-between;color:var(--muted);font-size:13.5px;margin-bottom:6px}
.chips{display:flex;gap:8px;margin:4px 0 12px;overflow-x:auto;scrollbar-width:none}
.chip{padding:7px 14px;border-radius:20px;background:var(--card);border:1px solid var(--line);font-size:14px;white-space:nowrap;font-weight:500}
.chip.on{background:var(--text);color:var(--bg);border-color:transparent}

.lesson{display:flex;gap:11px;align-items:center;padding:9px;border-radius:14px;background:var(--card);border:1px solid var(--line);margin-bottom:8px;cursor:pointer}
.lesson.playing{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.l-th{width:108px;aspect-ratio:16/9;border-radius:9px;overflow:hidden;position:relative;background:var(--line);flex:none}
.l-th img{width:100%;height:100%;object-fit:cover}
.l-num{position:absolute;top:4px;inset-inline-start:4px;background:rgba(0,0,0,.65);color:#fff;font-size:12px;font-weight:700;border-radius:6px;padding:0 6px;line-height:20px}
.l-dur{position:absolute;bottom:6px;inset-inline-end:4px;background:rgba(0,0,0,.72);color:#fff;font-size:11.5px;border-radius:5px;padding:0 5px;line-height:18px;direction:ltr}
.l-prog{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.35)}
.l-prog i{display:block;height:100%;background:#e53935}
.lesson.done .l-th::after{content:"";position:absolute;inset:0;background:rgba(15,118,110,.45)}
.l-ok{position:absolute;z-index:2;inset:0;display:grid;place-items:center;color:#0f766e}
.l-main{flex:1;min-width:0}
.l-title{font-weight:600;font-size:14.5px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lesson.done .l-title{color:var(--muted)}
.l-meta{font-size:12.5px;color:var(--muted);margin-top:3px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.l-meta .ok{color:var(--accent);font-weight:700}
.l-meta .tag{display:inline-flex;align-items:center;gap:3px}
.now-badge{color:var(--accent);font-weight:700}

/* FAB */
.fab{position:fixed;z-index:30;inset-inline-end:18px;bottom:calc(var(--safe-b) + 18px);width:58px;height:58px;border-radius:18px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 8px 24px rgba(15,118,110,.4)}
body.has-mini .fab{bottom:calc(var(--safe-b) + 92px)}
.fab:active{transform:scale(.95)}

/* mini player */
.mini{position:fixed;z-index:35;left:10px;right:10px;bottom:calc(var(--safe-b) + 10px);max-width:660px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.18);display:flex;align-items:center;gap:10px;padding:8px;overflow:hidden;cursor:pointer}
.mini img{width:62px;aspect-ratio:16/9;border-radius:8px;object-fit:cover;background:var(--line)}
.mini .mt{flex:1;min-width:0}
.mini .mt b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .mt small{color:var(--muted);font-size:12px;direction:ltr;display:inline-block}
.mini .mp{width:44px;height:44px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.mini .mprog{position:absolute;left:0;right:0;bottom:0;height:3px;direction:ltr}
.mini .mprog i{display:block;height:100%;background:var(--accent)}

/* player overlay */
.player{position:fixed;inset:0;z-index:50;background:var(--bg);transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;pointer-events:none}
.player.open{transform:none;pointer-events:auto}
.p-top{display:flex;align-items:center;gap:8px;padding:calc(var(--safe-t) + 8px) 14px 8px}
.p-top .ttl{flex:1;text-align:center;font-size:13.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px calc(var(--safe-b) + 40px)}
.p-inner{max-width:680px;margin:0 auto}
.stage{position:relative;width:100%;aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:#000}
#yt-host,#yt-host iframe,#yt{position:absolute;inset:0;width:100%;height:100%;border:0}
.cover{position:absolute;inset:0;z-index:2;display:grid;place-items:center;cursor:pointer;overflow:hidden;background:#111}
.cover-bg{position:absolute;inset:-20px;background-size:cover;background-position:center;filter:blur(18px) brightness(.55);transform:scale(1.1)}
.cover img{position:relative;width:62%;aspect-ratio:16/9;object-fit:cover;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.cover-badge{position:absolute;bottom:10px;inset-inline-start:10px;background:rgba(0,0,0,.55);color:#fff;font-size:12px;padding:3px 9px;border-radius:20px;display:flex;align-items:center;gap:5px}
.stage.video .cover{display:none}
.stage-msg{position:absolute;inset:0;z-index:3;background:rgba(0,0,0,.82);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:18px;gap:10px;font-size:15px}
.stage-msg a{color:#fff;background:#c4302b;padding:8px 14px;border-radius:10px;text-decoration:none;font-weight:600}
.tapnote{margin-top:10px;background:var(--accent-soft);color:var(--accent);border-radius:12px;padding:10px 12px;font-size:14px;font-weight:600;text-align:center}
.p-title{font-size:19px;font-weight:700;margin:14px 0 2px;line-height:1.45}
.p-author{color:var(--muted);font-size:14px}
.seek{margin-top:12px}
.seek input{width:100%;accent-color:var(--accent);height:28px}
.times{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin-top:-2px;font-variant-numeric:tabular-nums}
.ctrls{display:flex;align-items:center;justify-content:space-between;margin:8px 0 6px;padding:0 4px}
.ctrls button{display:grid;place-items:center;color:var(--text);position:relative}
.c-sm{width:46px;height:46px}
.c-md{width:56px;height:56px}
.c-md small{position:absolute;font-size:10.5px;font-weight:700;top:50%;left:50%;transform:translate(-50%,-42%)}
.c-play{width:76px;height:76px;border-radius:50%;background:var(--accent);color:var(--accent-ink)!important;box-shadow:0 8px 22px rgba(15,118,110,.35)}
.c-play:active,.c-md:active,.c-sm:active{transform:scale(.93)}
.tools{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:10px 0 16px}
.tools>*{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:11.5px;color:var(--muted);text-decoration:none;min-height:62px;justify-content:center}
.tools b{font-size:15px;color:var(--text);line-height:22px}
.tools .on{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.tools .on b{color:var(--accent)}
.tools svg{color:var(--text)}
.tools .on svg{color:var(--accent)}

.tabs{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px;margin-bottom:12px}
.tabs button{flex:1;padding:9px;border-radius:9px;font-weight:600;font-size:15px;color:var(--muted)}
.tabs button.on{background:var(--accent);color:var(--accent-ink)}
.tabs i{font-style:normal;opacity:.85;font-size:13px}

.maker{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
.maker textarea,.fld input,.fld select,.fld textarea,.maker input{width:100%;border:1px solid var(--line);background:var(--card2);border-radius:10px;padding:10px 12px;outline:none;resize:vertical}
.maker textarea{font-family:"Noto Naskh Arabic","IBM Plex Sans Arabic",serif;line-height:1.8;font-size:17px}
.maker textarea:focus,.maker input:focus,.fld input:focus,.fld textarea:focus,.fld select:focus{border-color:var(--accent)}
.maker-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;flex-wrap:wrap}
.chk{display:flex;align-items:center;gap:7px;font-size:14px;color:var(--muted)}
.chk input{width:20px;height:20px;accent-color:var(--accent)}
.chk b{color:var(--accent);direction:ltr;cursor:pointer;border-bottom:1px dashed}

.note{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px}
.note .nh{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.tchip{display:inline-flex;align-items:center;gap:4px;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:13px;padding:2px 9px;border-radius:20px;direction:ltr;font-variant-numeric:tabular-nums}
.note .nh .sp{flex:1}
.note .tx{font-family:"Noto Naskh Arabic","IBM Plex Sans Arabic",serif;font-size:17px;line-height:1.85;white-space:pre-wrap;word-wrap:break-word}
.note textarea{width:100%;min-height:90px;border:1px solid var(--accent);border-radius:10px;padding:8px 10px;font-family:"Noto Naskh Arabic",serif;font-size:17px;line-height:1.8;background:var(--card2)}
.empty-s{color:var(--muted);text-align:center;font-size:14px;padding:14px}

.ab{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ab-btn{width:100%;border-radius:12px;padding:10px;background:var(--card2);border:1px dashed var(--accent);display:flex;flex-direction:column;align-items:center}
.ab-btn small{color:var(--muted);font-size:12.5px}
.ab-btn b{font-size:20px;direction:ltr;font-variant-numeric:tabular-nums;color:var(--accent)}
.ab-btn.set{border-style:solid;background:var(--accent-soft)}
.adj{display:flex;gap:4px;margin-top:6px}
.adj button{flex:1;font-size:12.5px;padding:5px 0;border-radius:8px;background:var(--card2);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.maker input#clipName{margin-top:10px}

.clip{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 10px;margin-bottom:8px}
.clip.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.clip .cp{width:40px;height:40px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.clip .cm{flex:1;min-width:0}
.clip .cm b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clip .cm small{color:var(--muted);font-size:12.5px;direction:ltr;display:inline-block;font-variant-numeric:tabular-nums}
.clip .cm .ls{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clip .icon-btn.sm.on{color:var(--accent);background:var(--accent-soft)}

.group-h{font-weight:700;font-size:14.5px;margin:16px 2px 8px;display:flex;align-items:center;gap:8px;cursor:pointer}
.group-h .dot{width:9px;height:9px;border-radius:50%;flex:none}
.group-h small{color:var(--muted);font-weight:500}

.search-in{width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px 14px;outline:none;margin-bottom:12px}
.search-in:focus{border-color:var(--accent)}
mark{background:#ffe49a;color:inherit;border-radius:3px;padding:0 1px}
[data-theme=dark] mark{background:#6b5410}

/* sheets */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:80;opacity:0;pointer-events:none;transition:opacity .25s}
.backdrop.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:81;left:0;right:0;bottom:0;max-width:680px;margin:0 auto;background:var(--card);border-radius:22px 22px 0 0;padding:8px 18px calc(var(--safe-b) + 18px);max-height:88vh;overflow-y:auto;transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.sheet.open{transform:none}
.sheet .grab{width:42px;height:5px;border-radius:5px;background:var(--line);margin:4px auto 10px}
.sheet h3{margin:4px 0 12px;font-size:18px}
.sheet-actions{display:flex;gap:10px;margin-top:16px}
.sheet-actions .btn{flex:1}
.fld{display:block;margin-bottom:12px}
.fld>span{display:block;font-size:13.5px;color:var(--muted);margin-bottom:5px;font-weight:600}
.menu-item{display:flex;align-items:center;gap:12px;width:100%;padding:13px 6px;border-bottom:1px solid var(--line);font-size:16px;text-align:start;color:var(--text);text-decoration:none}
.menu-item:last-child{border-bottom:0}
.menu-item.danger{color:var(--danger)}
.menu-item svg{color:var(--muted)}
.menu-item.danger svg{color:var(--danger)}
.opt-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.opt{padding:12px 4px;border-radius:12px;background:var(--card2);border:1px solid var(--line);font-weight:600;text-align:center;font-variant-numeric:tabular-nums}
.opt.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.colors{display:flex;gap:10px;flex-wrap:wrap;padding:8px 0}
.colors button{width:36px;height:36px;border-radius:50%;border:3px solid transparent}
.colors button.on{border-color:var(--text)}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.set-row .lab{font-weight:600}
.set-row .lab small{display:block;color:var(--muted);font-weight:400;font-size:13px}
.seg{display:flex;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{padding:6px 10px;border-radius:8px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.switch{width:50px;height:30px;border-radius:30px;background:var(--line);position:relative;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:right .2s}
.switch.on{background:var(--accent)}
.switch.on::after{right:23px}
.help{font-size:14.5px;line-height:1.8}
.help h4{margin:16px 0 4px;font-size:15.5px}
.help ol,.help ul{margin:0;padding-inline-start:20px}

.toast{position:fixed;z-index:95;left:50%;bottom:calc(var(--safe-b) + 100px);transform:translate(-50%,20px);background:#1b1f1e;color:#fff;padding:10px 16px;border-radius:12px;font-size:14.5px;opacity:0;pointer-events:none;transition:all .25s;max-width:88vw;text-align:center}
[data-theme=dark] .toast{background:#eaeeed;color:#0d1211}
.toast.show{opacity:1;transform:translate(-50%,0)}
.spin{width:18px;height:18px;border:2.5px solid currentColor;border-top-color:transparent;border-radius:50%;animation:sp .8s linear infinite;display:inline-block;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
.ai-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;border-radius:14px;margin-bottom:12px;font-weight:700;font-size:15.5px;color:#fff;background:linear-gradient(135deg,#0f766e,#6d28d9)}
.ai-btn small{font-weight:500;opacity:.9;font-size:12.5px}
.ntag{font-size:11.5px;padding:1px 8px;border-radius:20px;background:var(--card2);border:1px solid var(--line);color:var(--muted);white-space:nowrap;font-weight:600}
.ntag.ai{color:#6d28d9;border-color:rgba(109,40,217,.3);background:rgba(109,40,217,.08)}
[data-theme=dark] .ntag.ai{color:#c4b5fd}
.note.summary{border-color:var(--gold)}
.ai-item{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.ai-item>input{width:22px;height:22px;accent-color:var(--accent);flex:none;margin-top:4px}
.ai-item .body{flex:1;min-width:0}
.ai-item .tx{display:block;font-family:"Noto Naskh Arabic",serif;font-size:16.5px;line-height:1.8}
.ai-wait{text-align:center;padding:22px 8px}
.ai-wait .spin{width:36px;height:36px;border-width:3px;color:var(--accent);margin-bottom:12px}
details{margin:10px 0}summary{cursor:pointer;color:var(--accent);font-weight:600}
.help a{color:var(--accent);font-weight:600}
.batch{display:flex;align-items:center;gap:10px;background:rgba(109,40,217,.08);border:1px solid rgba(109,40,217,.25);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:14px}
.batch .spin{color:#6d28d9}
#ytf-wrap{position:fixed;left:-10000px;top:0;width:320px;height:180px;opacity:0;pointer-events:none}
</style>
</head>
<body>
<div class="wrap" id="view"></div>

<button class="fab" id="fab" data-act="addOpen" aria-label="إضافة"></button>

<div class="mini hidden" id="mini" data-act="openPlayer">
  <img id="miniImg" alt="">
  <div class="mt"><b id="miniTitle"></b><small id="miniTime"></small></div>
  <button class="mp" data-act="toggle" id="miniBtn" aria-label="تشغيل/إيقاف"></button>
  <div class="mprog"><i id="miniProg" style="width:0"></i></div>
</div>

<section class="player" id="player" aria-hidden="true">
  <div class="p-top">

      </div>
      <div class="stage-msg hidden" id="stageMsg"></div>

    </div>

    </div>
    <div id="paneNotes">
      <button class="ai-btn" data-act="aiExtract" id="aiBtn"></button>
      <div class="maker">
        <textarea id="noteText" rows="3" placeholder="اكتب فائدة من هذا الدرس…"></textarea>
        <div class="maker-row">
          <label class="chk"><input type="checkbox" id="noteAtTime" checked> عند الدقيقة <b id="noteTime" data-act="noteRetime">0:00</b></label>
          <button class="btn primary" data-act="noteAdd">حفظ الفائدة</button>
        </div>
      </div>
      <div id="notesList"></div>
    </div>
    <div id="paneClips" class="hidden">
      <div class="maker">
        <div class="ab">
          <div>
            <button class="ab-btn" data-act="clipMark" data-w="a" id="abA"><small>بداية المقطع</small><b id="clipA">—</b></button>
            <div class="adj" dir="ltr"><button data-act="clipAdj" data-w="a" data-d="-5">-5</button><button data-act="clipAdj" data-w="a" data-d="-1">-1</button><button data-act="clipAdj" data-w="a" data-d="1">+1</button><button data-act="clipAdj" data-w="a" data-d="5">+5</button></div>
          </div>
          <div>
            <button class="ab-btn" data-act="clipMark" data-w="b" id="abB"><small>نهاية المقطع</small><b id="clipB">—</b></button>
            <div class="adj" dir="ltr"><button data-act="clipAdj" data-w="b" data-d="-5">-5</button><button data-act="clipAdj" data-w="b" data-d="-1">-1</button><button data-act="clipAdj" data-w="b" data-d="1">+1</button><button data-act="clipAdj" data-w="b" data-d="5">+5</button></div>
          </div>
        </div>
        <input id="clipName" placeholder="عنوان المقطع (اختياري)">
        <div class="maker-row">
          <button class="btn" data-act="clipPreview">معاينة</button>
          <button class="btn primary" data-act="clipSave" id="clipSaveBtn">حفظ المقطع</button>
        </div>
        <p class="hint">اضغط «بداية المقطع» عند اللحظة التي تريدها أثناء الاستماع، ثم «نهاية المقطع». الأزرار الصغيرة لضبط الثواني.</p>
      </div>
      <div id="clipsList"></div>
    </div>
  </div></div>
</section>

<script>
'use strict';
/* ============ أدوات عامة ============ */
const KEY = 'maktabati_sawtiya_v1';
const COLORS = ['#0f766e','#b45309','#7c3aed','#be123c','#1d4ed8','#4d7c0f','#a16207','#0e7490','#9d174d','#475569'];

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

const ICONS = {
  play:'<path d="M7 4.6v14.8a.8.8 0 0 0 1.2.7l12-7.4a.8.8 0 0 0 0-1.4l-12-7.4A.8.8 0 0 0 7 4.6z" fill="currentColor" stroke="none"/>',

  trash:'<path d="M4 7h16"/><path d="M9 7V4.5h6V7"/><path d="M6 7l1 13h10l1-13"/>',

  loop:'<path d="M17 2.5l3 3-3 3"/><path d="M4 11.5v-2a4 4 0 0 1 4-4h12"/><path d="M7 21.5l-3-3 3-3"/><path d="M20 12.5v2a4 4 0 0 1-4 4H4"/>',
  copy:'<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/>',
  flame:'<path d="M12 3c.8 3 5 5.2 5 10a5 5 0 0 1-10 0c0-2.2 1-3.6 2.2-4.6.1 2 1 3.1 2.2 3.3C11 9 10.2 6 12 3z"/>',
  dl:'<path d="M12 4v11"/><path d="M7 10.5l5 5 5-5"/><path d="M5 20h14"/>',
  ul:'<path d="M12 20V9"/><path d="M7 13.5l5-5 5 5"/><path d="M5 4h14"/>',
  paste:'<rect x="6" y="4.5" width="12" height="16" rx="2"/><path d="M9.5 4.5V3h5v1.5"/><path d="M9 11h6M9 15h4"/>',
  up:'<path d="M12 19V5M6 11l6-6 6 6"/>',
  dn:'<path d="M12 5v14M6 13l6 6 6-6"/>',
  move:'<path d="M4 8h13l-3-3M20 16H7l3 3"/>',
  reset:'<path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4.5V9h4.5"/>',
  list:'<path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1" fill="currentColor"/><circle cx="4.5" cy="12" r="1" fill="currentColor"/><circle cx="4.5" cy="18" r="1" fill="currentColor"/>',
  palette:'<path d="M12 3a9 9 0 1 0 0 18c1.2 0 1.8-.8 1.8-1.7 0-1.2-1-1.6-1-2.6 0-.9.7-1.6 1.6-1.6H17a4 4 0 0 0 4-4c0-4.4-4-8.1-9-8.1z"/><circle cx="7.5" cy="11" r="1.2" fill="currentColor"/><circle cx="10.5" cy="7" r="1.2" fill="currentColor"/><circle cx="15" cy="7.5" r="1.2" fill="currentColor"/>',
  info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/>'
};
function ic(n, s = 22, sw = 2) {
  return `<svg class="ic" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n] || ''}</svg>`;
}
function fmt(t) {
  t = Math.max(0, Math.floor(t || 0));
  const h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60), s = t % 60;
  return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(s).padStart(2, '0');
}
function human(sec) {
  const m = Math.round((sec || 0) / 60);
  if (m < 60) return m + ' د';
  const h = Math.floor(m / 60), r = m % 60;
  return h + ' س' + (r ? ' ' + r + ' د' : '');
}
function lessonsWord(n) {
  if (n === 1) return 'درس واحد'; if (n === 2) return 'درسان';
  if (n >= 3 && n <= 10) return n + ' دروس'; return n + ' درسًا';
}
function dayKey(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
const todayKey = () => dayKey(new Date());
function norm(s) {
  return String(s || '').toLowerCase()
    .replace(/[ً-ٰٟـ]/g, '')
    .replace(/[إأآٱ]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه').replace(/ؤ/g, 'و').replace(/ئ/g, 'ي');
}
function hl(text, q) {
  const t = String(text || '');
  if (!q) return esc(t);
  const nq = norm(q); if (!nq) return esc(t);
  // نبني خريطة بين النص المطبَّع والأصل لتظليل الكلمة رغم التشكيل
  let normStr = '', map = [];
  for (let i = 0; i < t.length; i++) { const n = norm(t[i]); for (let k = 0; k < n.length; k++) { normStr += n[k]; map.push(i); } }
  const out = []; let last = 0, idx = normStr.indexOf(nq);
  while (idx !== -1) {
    const s = map[idx], e = map[idx + nq.length - 1] + 1;
    if (s >= last) { out.push(esc(t.slice(last, s)), '<mark>', esc(t.slice(s, e)), '</mark>'); last = e; }
    idx = normStr.indexOf(nq, idx + nq.length);
  }
  out.push(esc(t.slice(last)));
  return out.join('');
}
const thumb = (vid, q = 'mqdefault') => `https://i.ytimg.com/vi/${vid}/${q}.jpg`;
const ytUrl = (vid, t) => `https://www.youtube.com/watch?v=${vid}` + (t ? `&t=${Math.floor(t)}s` : '');

/* ============ البيانات ============ */
function defaults() {
  return { v: 1, series: [], lessons: [], settings: { rate: 1, autoNext: true, showVideo: false, theme: 'auto', skip: 10, goal: 30, pauseOnNote: false, aiKey: '', aiModel: 'gemini-flash-latest', aiCount: 'auto' }, stats: { days: {} }, last: null };
}
function migrate(d) {
  const def = defaults();
  d.settings = Object.assign(def.settings, d.settings || {});
  d.series = Array.isArray(d.series) ? d.series : [];
  d.lessons = Array.isArray(d.lessons) ? d.lessons : [];
  d.stats = d.stats || { days: {} }; d.stats.days = d.stats.days || {};
  d.lessons.forEach(l => { l.notes = l.notes || []; l.clips = l.clips || []; l.pos = l.pos || 0; });
  return d;
}
function load() {
  try { const raw = localStorage.getItem(KEY); if (raw) return migrate(JSON.parse(raw)); } catch (e) {}
  return defaults();
}
let S = load();
let storageOK = true, saveT = null, lastSave = 0;
function save(now) {
  clearTimeout(saveT);
  const f = () => {
    try { localStorage.setItem(KEY, JSON.stringify(S)); storageOK = true; }
    catch (e) { if (storageOK) toast('تعذّر الحفظ على هذا الجهاز — صدّر نسخة احتياطية من الإعدادات'); storageOK = false; }
    lastSave = Date.now();
  };
  if (now) f(); else saveT = setTimeout(f, 350);
}
const L = id => S.lessons.find(l => l.id === id);
const SR = id => S.series.find(s => s.id === id);
const lessonsOf = sid => S.lessons.filter(l => l.seriesId === sid).sort((a, b) => a.order - b.order);
function seriesProgress(sid) {
  const ls = lessonsOf(sid), n = ls.length, done = ls.filter(l => l.done).length;
  let remain = 0, known = true;
  ls.forEach(l => { if (!l.done) { if (l.duration) remain += Math.max(0, l.duration - (l.pos || 0)); else known = false; } });
  return { n, done, pct: n ? Math.round(done / n * 100) : 0, remain, known };
}
function nextUp(sid) {
  const ls = lessonsOf(sid); if (!ls.length) return null;
  const recent = ls.filter(l => l.lastPlayed).sort((a, b) => b.lastPlayed - a.lastPlayed)[0];
  if (recent && !recent.done) return recent;
  if (recent) { const i = ls.indexOf(recent); const n = ls.slice(i + 1).find(l => !l.done); if (n) return n; }
  return ls.find(l => !l.done) || null;
}
function lessonPct(l) { return l.duration ? clamp(Math.round((l.pos || 0) / l.duration * 100), 0, 100) : 0; }

/* ============ روابط يوتيوب ============ */
function parseT(t) {
  if (!t) return 0;
  if (/^\d+$/.test(t)) return +t;
  const m = String(t).match(/(?:(\d+)h)?(?:(\d+)m)?(?:(\d+)s)?/);
  return m ? (+m[1] || 0) * 3600 + (+m[2] || 0) * 60 + (+m[3] || 0) : 0;
}
function parseYT(str) {
  str = String(str || '').trim().replace(/[)\]،,.]+$/, '');
  if (!str) return null;
  if (/^[\w-]{11}$/.test(str)) return { v: str, list: null, t: 0 };
  let u;
  try { u = new URL(/^https?:\/\//i.test(str) ? str : 'https://' + str); } catch (e) { return null; }
  const host = u.hostname.toLowerCase().replace(/^(www|m|music)\./, '');
  let v = null; const list = u.searchParams.get('list');
  if (host === 'youtu.be') v = u.pathname.split('/')[1] || null;
  else if (host === 'youtube.com' || host === 'youtube-nocookie.com') {
    v = u.searchParams.get('v');
    const m = u.pathname.match(/^\/(?:shorts|live|embed|v)\/([\w-]{11})/); if (m) v = m[1];
  } else return null;
  if (v && !/^[\w-]{11}$/.test(v)) v = v.slice(0, 11);
  if (v && !/^[\w-]{11}$/.test(v)) v = null;
  if (list && /^(WL|LL)$/.test(list) && !v) return null;
  if (!v && !list) return null;
  return { v, list: list || null, t: parseT(u.searchParams.get('t') || u.searchParams.get('start')) };
}
function extractLinks(text) {
  const tokens = String(text || '').split(/[\s\n]+/).filter(Boolean);
  const out = [], seen = new Set();
  tokens.forEach(tok => {
    const p = parseYT(tok); if (!p) return;
    const k = (p.v || '') + '|' + (p.list || '');
    if (!seen.has(k)) { seen.add(k); out.push(p); }
  });
  return out;
}

/* ============ مشغّل يوتيوب ============ */
let YTP = null, playerReady = false, loadedVid = null, ytState = -1, pending = null;
let cur = S.last && L(S.last) ? S.last : null;
let activeClip = null, sleep = null, needTap = false, wdT = null, ytErr = null, lastTick = 0;
let ytApiOk = false, ytApiFailed = false;
const ytReadyP = new Promise(res => { window.onYouTubeIframeAPIReady = () => { ytApiOk = true; res(); render(); }; });
(function loadApi() {
  const s = document.createElement('script');
  s.src = 'https://www.youtube.com/iframe_api';
  s.onerror = () => { ytApiFailed = true; render(); };
  document.head.appendChild(s);
  setTimeout(() => { if (!ytApiOk) { ytApiFailed = true; render(); } }, 15000);
})();

function playerVars(st, autoplay) {
  const pv = { playsinline: 1, rel: 0, modestbranding: 1, iv_load_policy: 3, autoplay: autoplay ? 1 : 0, start: Math.floor(st || 0), hl: 'ar' };
  if (/^https?:$/.test(location.protocol)) pv.origin = location.origin;
  return pv;
}
function createPlayer(vid, st, autoplay) {
  playerReady = false; loadedVid = vid;
  YTP = new YT.Player('yt', {
    width: '100%', height: '100%', videoId: vid, playerVars: playerVars(st, autoplay),
    events: {
      onReady: () => {
        playerReady = true;
        try { YTP.setPlaybackRate(S.settings.rate); } catch (e) {}
        if (pending) { const p = pending; pending = null; ensurePlayer(p.vid, p.st, p.autoplay); }
        else if (autoplay) { try { YTP.playVideo(); } catch (e) {} armWatchdog(); }
      },
      onStateChange: onState,
      onError: onYtError,
      onPlaybackRateChange: e => { if (e.data && e.data !== S.settings.rate) { S.settings.rate = e.data; save(); renderTools(); } }
    }
  });
  if (autoplay) armWatchdog();
}
function ensurePlayer(vid, st, autoplay) {
  ytErr = null; renderStageMsg();
  if (!window.YT || !YT.Player) {
    pending = { vid, st, autoplay };
    ytReadyP.then(() => { if (pending && !YTP) { const p = pending; pending = null; ensurePlayer(p.vid, p.st, p.autoplay); } });
    return;
  }
  if (!YTP) { createPlayer(vid, st, autoplay); return; }
  if (!playerReady) { pending = { vid, st, autoplay }; return; }
  try {
    if (loadedVid === vid) { YTP.seekTo(st, true); if (autoplay) YTP.playVideo(); }
    else if (autoplay) YTP.loadVideoById({ videoId: vid, startSeconds: st });
    else YTP.cueVideoById({ videoId: vid, startSeconds: st });
  } catch (e) {}
  loadedVid = vid;
  if (autoplay) armWatchdog();
}
function armWatchdog() {
  clearTimeout(wdT);
  wdT = setTimeout(() => {
    if (ytState !== 1 && ytState !== 3 && !ytErr && cur) { needTap = true; renderStage(); openPlayer(); }
  }, 3200);
}
function onState(e) {
  ytState = e.data;
  const l = L(cur);
  if (ytState === 1) {
    needTap = false; lastTick = Date.now(); clearTimeout(wdT);
    try { if (YTP.getPlaybackRate() !== S.settings.rate) YTP.setPlaybackRate(S.settings.rate); } catch (er) {}
    if (l) {
      try {
        const vd = YTP.getVideoData();
        if (vd && vd.title && l.titleAuto && !l.metaOk) { l.title = vd.title; l.author = vd.author || ''; l.metaOk = true; renderPlayerHead(); render(); }
        const d = YTP.getDuration(); if (d > 0) l.duration = Math.round(d);
      } catch (er) {}
    }
    renderStage();
  }
  if (ytState === 0 && l) {
    if (activeClip) { activeClip = null; renderClips(); }
    l.pos = 0;
    if (!l.done) markDone(l, true, true); else save(true);
    if (sleep && sleep.end) { sleep = null; renderTools(); toast('توقّف التشغيل بنهاية الدرس'); renderPlayState(); return; }
    if (S.settings.autoNext) {
      const n = nextAfter(l);
      if (n) { toast('الدرس التالي: ' + n.title); setTimeout(() => playLesson(n.id, { open: false }), 900); }
    }
  }
  if (ytState === 2) save(true);
  renderPlayState();

function withTimeout(p, ms, fallback) { return Promise.race([p, new Promise(r => setTimeout(() => r(fallback), ms))]); }

/* جلب العناوين وقوائم التشغيل */
async function oembedTitle(url) {
  const eps = ['https://www.youtube.com/oembed?format=json&url=', 'https://noembed.com/embed?url='];
  for (const ep of eps) {
    try {
      const ctrl = new AbortController(); const to = setTimeout(() => ctrl.abort(), 6000);
      const r = await fetch(ep + encodeURIComponent(url), { signal: ctrl.signal }); clearTimeout(to);
      if (!r.ok) continue;
      const j = await r.json();
      if (j && j.title) return { title: j.title, author: j.author_name || '' };
    } catch (e) {}
  }
  return null;
}
let FET = null, fetP = null; const fetListeners = new Set();
function getFetcher() {
  if (fetP) return fetP;
  fetP = ytReadyP.then(() => new Promise(res => {
    FET = new YT.Player('ytf', { width: 320, height: 180, playerVars: { playsinline: 1, mute: 1, autoplay: 0, controls: 0 },
      events: { onReady: () => res(FET), onStateChange: e => fetListeners.forEach(f => f(e)) } });
  }));
  return fetP;
}
function fetchPlaylist(listId) {
  return getFetcher().then(f => new Promise(res => {
    let tries = 0, lastLen = -1, stable = 0;
    try { f.cuePlaylist({ listType: 'playlist', list: listId }); } catch (e) { res(null); return; }
    const iv = setInterval(() => {
      tries++;
      let pl = null; try { pl = f.getPlaylist(); } catch (e) {}
      if (pl && pl.length) {
        if (pl.length === lastLen) stable++; else { stable = 0; lastLen = pl.length; }
        if (stable >= 2) { clearInterval(iv); res(pl.slice()); return; }
      }
      if (tries > 40) { clearInterval(iv); res(pl && pl.length ? pl.slice() : null); }
    }, 350);
  }));
}
function metaViaPlayer(l) {
  return withTimeout(getFetcher().then(f => new Promise(res => {
    let done = false;
    const fin = () => {
      if (done) return; done = true; fetListeners.delete(h);
      try {
        const vd = f.getVideoData();
        if (vd && vd.title && vd.video_id === l.videoId) { if (l.titleAuto) l.title = vd.title; l.author = vd.author || ''; l.metaOk = true; }
        const d = f.getDuration(); if (d > 0 && !l.duration) l.duration = Math.round(d);
      } catch (e) {}
      res();
    };
    const h = e => { if (e.data === 5 || e.data === 1 || e.data === -1) setTimeout(fin, 600); };
    fetListeners.add(h);
    try { f.cueVideoById(l.videoId); } catch (e) { fin(); }
    setTimeout(fin, 7000);
  })), 12000);
}
const metaQ = [], slowQ = []; let metaBusy = false;
function queueMeta(ids) { ids.forEach(id => { if (!metaQ.includes(id)) metaQ.push(id); }); runMeta(); }
async function runMeta() {
  if (metaBusy) return; metaBusy = true;
  try {
    while (metaQ.length) {
      const batch = metaQ.splice(0, 4);
      await Promise.all(batch.map(async id => {
        const l = L(id); if (!l || l.metaOk) return;
        const r = await oembedTitle('https://www.youtube.com/watch?v=' + l.videoId);
        if (r) { if (l.titleAuto) l.title = r.title; l.author = r.author; l.metaOk = true; }
        else if (!slowQ.includes(id)) slowQ.push(id);
      }));
      save(); render(); if (cur) renderPlayerHead();
    }
    while (slowQ.length) {
      const id = slowQ.shift(), l = L(id); if (!l || l.metaOk) continue;
      await metaViaPlayer(l); save(); render(); if (cur === id) renderPlayerHead();
    }
  } finally { metaBusy = false; }
}

const AI_TYPES = ['تعريف', 'قاعدة', 'دليل', 'مسألة', 'خلاف', 'تنبيه', 'فائدة'];
class AiError extends Error { constructor(msg, code) { super(msg); this.code = code; } }
function parseClock(v) {
  if (typeof v === 'number') return v;
  const p = String(v || '').trim().replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).split(':').map(x => parseFloat(x));
  if (!p.length || p.some(isNaN)) return null;
  return p.reduce((a, b) => a * 60 + b, 0);
}
function aiPrompt(l) {

استمع إلى الدرس كاملًا واستخرج الفوائد العلمية التي ذكرها الشيخ.
الشروط:
1. ${n === 'auto' ? 'استخرج كل فائدة علمية مستقلة ذات قيمة، دون تكرار ولا حشو.' : 'استخرج قرابة ' + n + ' فائدة هي الأهم في الدرس.'}
2. اكتب كل فائدة في جملة أو جملتين بعربية فصيحة واضحة، أمينة لكلام الشيخ ومعناه، ولا تضف شيئًا من عندك ولا من مصادر خارج الدرس.
3. إذا ذكر الشيخ آية أو حديثًا أو قول عالم أو تعريفًا أو قاعدة أو خلافًا فاذكره كما ورد في كلامه، ولا تنسب قولًا إلى أحد لم ينسبه الشيخ إليه.
4. لا تخترع أسماء كتب ولا أرقام صفحات ولا أحكامًا على الأحاديث لم يذكرها الشيخ.
5. لكل فائدة اذكر التوقيت الذي بدأ فيه الشيخ الكلام عنها بصيغة MM:SS أو H:MM:SS.
6. صنّف كل فائدة بنوع واحد من: ${AI_TYPES.join('، ')}.
7. اكتب ملخصًا للدرس في ثلاث جمل أو أربع.
8. رتّب الفوائد بحسب ورودها في الدرس.
أعد JSON فقط بهذا الشكل دون أي نص آخر:
{"summary":"...","benefits":[{"time":"MM:SS","type":"تعريف","text":"..."}]}`;

function parseAI(txt, l) {
  const t = String(txt).trim().replace(/^```(?:json)?/i, '').replace(/```$/, '').trim();
  let j = null;
  try { j = JSON.parse(t); } catch (e) { const m = t.match(/\{[\s\S]*\}/); if (m) { try { j = JSON.parse(m[0]); } catch (er) {} } }
  if (!j) throw new Error('parse');
  const arr = Array.isArray(j) ? j : (j.benefits || j.fawaid || []);
  const dur = l.duration || 0;
  const items = arr.map(b => {
    let sec = parseClock(b.time ?? b.t);
    if (sec != null && dur && sec > dur + 5) sec = null;
    return { t: sec != null ? Math.floor(sec) : null, text: String(b.text || '').trim(), type: AI_TYPES.includes(b.type) ? b.type : '' };
  }).filter(x => x.text);
  return { summary: Array.isArray(j) ? '' : String(j.summary || '').trim(), items };
}
function aiSleep(ms, signal) {
  return new Promise((res, rej) => {
    const t = setTimeout(res, ms);
    if (signal) signal.addEventListener('abort', () => { clearTimeout(t); rej(new AiError('أُلغي.', 'abort')); }, { once: true });
  });
}
// عند انشغال Gemini (5xx) أو امتلاء حدّ نموذج (429): يعيد المحاولة تلقائيًا، ثم ينتقل إلى نموذج آخر بدل التوقف
async function geminiCall(l, signal, onStatus) {
  const key = (S.settings.aiKey || '').trim();
  if (!key) throw new AiError('أضف مفتاح Gemini أولًا.', 'nokey');
  const models = [S.settings.aiModel, 'gemini-flash-latest', 'gemini-2.5-flash', 'gemini-flash-lite-latest', 'gemini-2.5-flash-lite'].filter((v, i, a) => v && a.indexOf(v) === i);
  const say = m => { try { onStatus && onStatus(m); } catch (e) {} };
  let lowRes = true, lastErr = null, busyMsg = '', sawBusy = false, sawQuota = false;
  for (let mi = 0; mi < models.length; mi++) {
    for (let attempt = 0; attempt < 3; attempt++) {
      if (attempt) { say(`Gemini مشغول، أعيد المحاولة تلقائيًا (${attempt + 1} من 3)…`); await aiSleep(attempt === 1 ? 4000 : 10000, signal); }
      let out;
      try { out = await geminiOnce(l, signal, key, models[mi], lowRes); }
      catch (e) {
        if (e.code === 'lowres') { lowRes = false; attempt--; continue; }
        if (e.code === 'busy') { sawBusy = true; busyMsg = e.detail || busyMsg; lastErr = e; continue; }
        if (e.code === 'quota') { sawQuota = true; lastErr = e; break; }
        if (e.code === 'model') { lastErr = e; break; }
        throw e;
      }
      return out;
    }
    if (mi + 1 < models.length) say('أجرّب نموذجًا آخر من Gemini…');
  }
  if (sawBusy) throw new AiError('خدمة Gemini مشغولة الآن رغم إعادة المحاولة عدة مرات. جرّب بعد ربع ساعة.' + (busyMsg ? ' (' + busyMsg.slice(0, 120) + ')' : ''), 'busy');
  if (sawQuota) throw new AiError('بلغتَ الحدّ المجاني المؤقت في كل النماذج. انتظر قليلًا ثم أعد المحاولة (الحدّ نحو 8 ساعات فيديو يوميًا).', 'quota');
  throw lastErr || new AiError('لم أجد نموذجًا متاحًا.', 'model');
}
async function geminiOnce(l, signal, key, model, lowRes) {
  {
    const body = {
      contents: [{ role: 'user', parts: [{ fileData: { fileUri: 'https://www.youtube.com/watch?v=' + l.videoId } }, { text: aiPrompt(l) }] }],
      generationConfig: Object.assign({ temperature: 0.3, responseMimeType: 'application/json' }, lowRes ? { mediaResolution: 'MEDIA_RESOLUTION_LOW' } : {})
    };
    let r, j = null;
    try {
      r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(key)}`,
        { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body), signal });
    } catch (e) {
      if (e.name === 'AbortError' || (signal && signal.aborted)) throw new AiError('أُلغي.', 'abort');
      throw new AiError('تعذّر الاتصال بخدمة Gemini. تحقّق من الإنترنت.', 'net');
    }
    try { j = await r.json(); } catch (e) {}
    const msg = (j && j.error && j.error.message) || '';
    if (r.status === 404) throw new AiError('النموذج غير متاح: ' + model, 'model');
    if (r.status === 400 && lowRes && /media.?resolution/i.test(msg)) throw new AiError('', 'lowres');
    if (!r.ok) {
      if (/api key/i.test(msg) || r.status === 401) throw new AiError('مفتاح Gemini غير صالح. راجعه في الإعداد.', 'key');
      if (r.status === 403) throw new AiError('المفتاح مرفوض أو غير مفعّل. راجعه في الإعداد.', 'key');
      if (r.status === 429) throw new AiError('بلغتَ الحدّ المجاني المؤقت.', 'quota');
      if (r.status >= 500) { const e = new AiError('خدمة Gemini مشغولة الآن.', 'busy'); e.detail = msg; throw e; }
      throw new AiError('تعذّرت معالجة هذا الفيديو' + (msg ? ': ' + msg.slice(0, 180) : '.'), 'video');
    }
    const cand = j && j.candidates && j.candidates[0];
    const txt = cand && cand.content && (cand.content.parts || []).filter(p => !p.thought).map(p => p.text || '').join('');
    if (!txt) throw new AiError('لم يُرجِع Gemini نتيجة' + (cand && cand.finishReason ? ' (' + cand.finishReason + ')' : '') + '. أعد المحاولة.', 'empty');
    try { return parseAI(txt, l); } catch (e) { throw new AiError('وصلت نتيجة غير مفهومة. أعد المحاولة.', 'parse'); }
  }
}

async function runBatch(sid) {
  if (!S.settings.aiKey) { aiSetupSheet(false); return; }
  if (batch) { toast('يوجد استخراج جارٍ الآن'); return; }
  const ids = lessonsOf(sid).filter(l => !l.aiAt).map(l => l.id);
  if (!ids.length) { toast('كل دروس السلسلة استُخرجت فوائدها'); return; }
  batch = { sid, ids, i: 0, ok: 0, fail: 0, ctrl: new AbortController() };
  render(); if (cur) renderNotes();
  for (; batch.i < ids.length; batch.i++) {
    const l = L(ids[batch.i]); if (!l) continue;
    render(); if (cur) renderNotes();
    try {
      const r = await geminiCall(l, batch.ctrl.signal);
      addAiNotes(l, r.summary, r.items); batch.ok++; save(true);
      if (cur === l.id) renderNotes();
    } catch (e) {
      if (e.code === 'abort') break;
      batch.fail++;
      if (['key', 'nokey', 'quota', 'net'].includes(e.code)) { toast(e.message); break; }
    }
  }
  const b = batch; batch = null; render(); if (cur) renderNotes();
  toast(`انتهى الاستخراج: ${lessonsWord(b.ok)}${b.fail ? ' · تعذّر ' + b.fail : ''}`);
}

      <ol><li>افتح <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.com/apikey</a> وادخل بحساب Google.</li><li>اضغط «Create API key».</li><li>انسخ المفتاح والصقه هنا.</li></ol></div>
    <label class="fld" style="margin-top:12px"><span>مفتاح Gemini API</span><input id="aiKeyIn" dir="ltr" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="AIza…" value="${esc(st.aiKey)}"></label>
    <div class="set-row"><div class="lab">عدد الفوائد</div><div class="seg">${['auto', 10, 20, 30].map(v => `<button class="${st.aiCount === v ? 'on' : ''}" data-act="setOpt" data-k="aiCount" data-v="${v}">${v === 'auto' ? 'تلقائي' : v}</button>`).join('')}</div></div>
    <details><summary>متقدّم</summary><label class="fld" style="margin-top:8px"><span>اسم النموذج</span><input id="aiModelIn" dir="ltr" autocapitalize="off" value="${esc(st.aiModel)}"></label></details>
    <p class="hint">يُحفظ المفتاح في هذا الجهاز فقط، ولا يكون داخل ملف التطبيق.</p>
    <div class="sheet-actions"><button class="btn" data-act="aiTest">اختبار المفتاح</button><button class="btn primary" data-act="aiKeySave" data-v="${thenExtract ? 1 : 0}">حفظ</button></div>`);
}

/* ============ معالجة النقرات ============ */
const A = {
  home: () => go(''),
  gotoSearch: () => go('search'), gotoNotes: () => go('notes'), gotoClips: () => go('clips'),
  settings: settingsSheet,
  openSeries: id => go('s-' + id),
  addOpen: id => openAdd(id || (view.name === 'series' ? view.id : null)),
  filter: id => { filter = id; render(); },
  play: id => playLesson(id),
  playStart: id => { closeSheet(); const l = L(id); l.pos = 0; playLesson(id, { start: 0 }); },
  lessonMenu: id => lessonMenu(id),
  lessonMenuCur: () => cur && lessonMenu(cur),
  seriesMenu: id => seriesMenu(id),
  openPlayer: () => { openPlayer(); renderPlayerAll(); },
  closePlayer,
  toggle: togglePlay,
  back: () => userSeek(curTime() - S.settings.skip),
  fwd: () => userSeek(curTime() + S.settings.skip),
  prev: () => { if (curTime() > 5) { userSeek(0); return; } const p = neighbor(-1); p ? playLesson(p.id, { open: false }) : userSeek(0); },
  next: () => { const n = neighbor(1); n ? playLesson(n.id, { open: false }) : toast('هذا آخر درس في السلسلة'); },
  speed: speedSheet,
  setRate: (_, b) => { const r = +b.dataset.r; S.settings.rate = r; save(); try { YTP && YTP.setPlaybackRate(r); } catch (e) {} renderTools(); closeSheet(); },
  sleep: sleepSheet,
  setSleep: (_, b) => {
    const m = b.dataset.m;
    if (m === 'off') { sleep = null; toast('أُلغي مؤقّت النوم'); }
    else if (m === 'end') { sleep = { end: true }; toast('سيتوقّف التشغيل بنهاية الدرس'); }
    else { sleep = { until: Date.now() + (+m) * 60000 }; toast('سيتوقّف التشغيل بعد ' + m + ' دقيقة'); }
    renderTools(); closeSheet();
  },
  videoToggle: () => { S.settings.showVideo = !S.settings.showVideo; save(); renderStage(); renderTools(); },
  doneCur: () => { const l = L(cur); if (l) { markDone(l, !l.done); toast(l.done ? '✓ عُلِّم الدرس كمنتهٍ' : 'أُلغيت علامة الانتهاء'); } },
  toggleDone: id => { const l = L(id); markDone(l, !l.done); closeSheet(); },
  tab: (_, b) => {
    tab = b.dataset.tab;
    $('#tabNotes').classList.toggle('on', tab === 'notes'); $('#tabClips').classList.toggle('on', tab === 'clips');
    $('#paneNotes').classList.toggle('hidden', tab !== 'notes'); $('#paneClips').classList.toggle('hidden', tab !== 'clips');
  },
  /* الفوائد */
  noteRetime: (_, b, e) => { e.preventDefault(); noteT = curTime(); $('#noteTime').textContent = fmt(noteT); toast('رُبطت الفائدة بالدقيقة ' + fmt(noteT)); },
  noteAdd: () => {
    const l = L(cur), ta = $('#noteText'), text = ta.value.trim();
    if (!l) return; if (!text) { ta.focus(); toast('اكتب الفائدة أولًا'); return; }
    const t = $('#noteAtTime').checked ? (noteT != null ? noteT : curTime()) : null;
    l.notes.push({ id: uid(), t: t != null ? Math.floor(t) : null, text, createdAt: Date.now() });
    ta.value = ''; noteT = null; ta.blur(); save(true); renderNotes(); render(); toast('حُفظت الفائدة ✓');
  },
  noteSeek: (_, b) => {
    const lid = b.dataset.l, t = +b.dataset.t;
    if (lid === cur && YTP && playerReady && loadedVid === L(lid).videoId) { userSeek(t); if (ytState !== 1) { YTP.playVideo(); armWatchdog(); } }
    else playLesson(lid, { start: t });
  },
  noteEdit: (id, b) => {
    const l = L(b.dataset.l), n = l && l.notes.find(x => x.id === id); if (!n) return;
    const box = b.closest('.note'); const tx = box.querySelector('.tx');
    tx.outerHTML = `<textarea class="edit-ta">${esc(n.text)}</textarea><div class="maker-row"><button class="btn" data-act="noteCancel">إلغاء</button><button class="btn primary" data-act="noteSave" data-l="${l.id}" data-id="${id}">حفظ</button></div>`;
    const ta = box.querySelector('textarea'); ta.focus();
  },
  noteCancel: () => { renderNotes(); render(); },
  noteSave: (id, b) => {
    const l = L(b.dataset.l), n = l && l.notes.find(x => x.id === id); if (!n) return;
    const v = b.closest('.note').querySelector('textarea').value.trim(); if (v) n.text = v;
    save(true); renderNotes(); render(); toast('تم التعديل ✓');
  },
  noteDel: async (id, b) => {
    const l = L(b.dataset.l); if (!l) return;
    if (!(await ask('حذف هذه الفائدة؟', 'حذف', true))) return;
    l.notes = l.notes.filter(n => n.id !== id); save(true); renderNotes(); render();
  },
  copyAllNotes: () => { const t = allNotesText(); t ? copyText(t, 'نُسخت كل الفوائد ✓') : toast('لا فوائد بعد'); },
  dlAllNotes: () => { const t = allNotesText(); if (t) downloadFile('فوائدي.txt', t); },
  /* المقاطع */
  clipMark: (_, b) => {
    const w = b.dataset.w, t = Math.floor(curTime());
    clipDraft[w] = t;
    if (w === 'a' && clipDraft.b != null && clipDraft.b <= t) clipDraft.b = null;
    renderClips(); toast((w === 'a' ? 'البداية: ' : 'النهاية: ') + fmt(t));
  },
  clipAdj: (_, b) => {
    const w = b.dataset.w, d = +b.dataset.d;
    if (clipDraft[w] == null) clipDraft[w] = Math.floor(curTime());
    clipDraft[w] = Math.max(0, clipDraft[w] + d); renderClips();
  },
  clipPreview: () => {
    const { a, b } = clipDraft;
    if (a == null || b == null || b <= a) { toast('حدّد البداية ثم النهاية أولًا'); return; }
    activeClip = { id: '_draft', start: a, end: b, loop: false };
    if (YTP && playerReady) { YTP.seekTo(a, true); YTP.playVideo(); armWatchdog(); }
    renderClips();
  },
  clipSave: () => {
    const l = L(cur), { a, b } = clipDraft;
    if (!l) return;
    if (a == null || b == null) { toast('حدّد البداية والنهاية أولًا'); return; }
    if (b <= a) { toast('النهاية يجب أن تكون بعد البداية'); return; }
    const name = $('#clipName').value.trim();
    l.clips.push({ id: uid(), start: a, end: b, title: name || 'مقطع ' + (l.clips.length + 1), createdAt: Date.now() });
    clipDraft = { a: null, b: null }; $('#clipName').value = '';
    save(true); renderClips(); render(); toast('حُفظ المقطع ✓');
  },
  clipPlay: (id, b) => {
    const l = L(b.dataset.l), c = l && l.clips.find(x => x.id === id); if (!c) return;
    const clip = { id: c.id, start: c.start, end: c.end, loop: false };
    if (l.id === cur && YTP && playerReady && loadedVid === l.videoId) { activeClip = clip; YTP.seekTo(c.start, true); YTP.playVideo(); armWatchdog(); renderClips(); render(); }
    else playLesson(l.id, { clip });
  },
  clipLoop: (id, b) => {
    const l = L(b.dataset.l), c = l && l.clips.find(x => x.id === id); if (!c) return;
    if (activeClip && activeClip.id === id && activeClip.loop && l.id === cur) { activeClip.loop = false; toast('أُوقف التكرار'); renderClips(); render(); return; }
    const clip = { id: c.id, start: c.start, end: c.end, loop: true };
    if (l.id === cur && YTP && playerReady && loadedVid === l.videoId) { activeClip = clip; YTP.seekTo(c.start, true); YTP.playVideo(); armWatchdog(); }
    else playLesson(l.id, { clip });
    toast('تكرار المقطع 🔁'); renderClips(); render();
  },
  clipMenu: (id, b) => {
    const l = L(b.dataset.l), c = l && l.clips.find(x => x.id === id); if (!c) return;
    openSheet(`<h3>${esc(c.title)}</h3><p class="hint" style="margin-top:-6px" dir="ltr">${fmt(c.start)} → ${fmt(c.end)}</p>
      <button class="menu-item" data-act="clipRename" data-l="${l.id}" data-id="${id}">${ic('edit')} إعادة تسمية</button>
      <button class="menu-item" data-act="clipCopy" data-l="${l.id}" data-id="${id}">${ic('copy')} نسخ رابط المقطع</button>
      <a class="menu-item" href="https://www.youtube.com/embed/${l.videoId}?start=${c.start}&end=${c.end}&autoplay=1" target="_blank" rel="noopener">${ic('ext')} فتح المقطع وحده في المتصفح</a>
      <button class="menu-item danger" data-act="clipDel" data-l="${l.id}" data-id="${id}">${ic('trash')} حذف المقطع</button>`);
  },
  clipRename: async (id, b) => {
    const l = L(b.dataset.l), c = l && l.clips.find(x => x.id === id); if (!c) return;
    const v = await askText('عنوان المقطع', c.title); if (v) { c.title = v; save(true); renderClips(); render(); }
  },
  clipCopy: (id, b) => {
    const l = L(b.dataset.l), c = l && l.clips.find(x => x.id === id); if (!c) return;
    closeSheet();
    copyText(`${c.title}\nhttps://www.youtube.com/embed/${l.videoId}?start=${c.start}&end=${c.end}`, 'نُسخ رابط المقطع ✓');
  },
  clipDel: async (id, b) => {
    const l = L(b.dataset.l); if (!l) return;
    if (!(await ask('حذف هذا المقطع؟', 'حذف', true))) return;
    l.clips = l.clips.filter(c => c.id !== id); if (activeClip && activeClip.id === id) activeClip = null;
    save(true); renderClips(); render();
  },
  /* الإضافة */
  pasteLinks: async () => {
    try { const t = await navigator.clipboard.readText(); const ta = $('#addLinks'); ta.value = (ta.value.trim() ? ta.value.trim() + '\n' : '') + t; detectLinks(); }
    catch (e) { toast('اضغط مطوّلًا داخل المربع واختر «لصق»'); $('#addLinks').focus(); }
  },
  doAdd,
  aiExtract: id => aiExtract(id),
  aiCancel: () => { if (aiCtrl) aiCtrl.abort(); aiCtrl = null; closeSheet(); toast('أُلغي الاستخراج'); },
  aiAll: (_, b) => sheet.querySelectorAll('.aiChk,#aiSumChk').forEach(c => { c.checked = b.dataset.v === '1'; }),
  aiSave: () => {
    const r = aiResult, l = r && L(r.lid); if (!l) { closeSheet(); return; }
    if ($('#aiReplace') && $('#aiReplace').checked) l.notes = l.notes.filter(n => !n.ai);
    const items = [...sheet.querySelectorAll('.aiChk')].filter(c => c.checked).map(c => r.items[+c.dataset.k]);
    const sum = r.summary && $('#aiSumChk') && $('#aiSumChk').checked ? r.summary : '';
    addAiNotes(l, sum, items); aiResult = null;
    save(true); closeSheet(); if (cur === l.id) renderNotes(); render(); toast(`حُفظت ${items.length} فائدة ✓`);
  },
  aiSetup: () => aiSetupSheet(false),
  aiKeySave: (_, b) => {
    S.settings.aiKey = $('#aiKeyIn').value.trim();
    const m = $('#aiModelIn'); S.settings.aiModel = (m && m.value.trim()) || 'gemini-flash-latest';
    save(true); closeSheet(); if (cur) renderNotes();
    toast(S.settings.aiKey ? 'حُفظ المفتاح ✓' : 'حُذف المفتاح');
    if (b.dataset.v === '1' && S.settings.aiKey && cur) setTimeout(() => aiExtract(cur), 350);
  },
  aiTest: async (_, b) => {
    const k = $('#aiKeyIn').value.trim(); if (!k) { toast('الصق المفتاح أولًا'); return; }
    b.innerHTML = '<span class="spin"></span>';
    try { const r = await fetch('https://generativelanguage.googleapis.com/v1beta/models?pageSize=1&key=' + encodeURIComponent(k)); toast(r.ok ? 'المفتاح يعمل ✓' : 'المفتاح لا يعمل ✗'); }
    catch (e) { toast('تعذّر الاتصال'); }
    b.textContent = 'اختبار المفتاح';
  },
  batchAi: id => { closeSheet(); runBatch(id); },
  stopBatch: () => { if (batch) { batch.ctrl.abort(); toast('جارٍ الإيقاف…'); } },
  sheetYes: () => sheetResolve && sheetResolve(true),
  sheetNo: () => sheetResolve ? sheetResolve(false) : closeSheet(),
  /* الدروس */
  renameLesson: async id => {
    const l = L(id); const v = await askText('اسم الدرس', l.title);
    if (v) { l.title = v; l.titleAuto = false; save(true); render(); if (id === cur) renderPlayerAll(); }
  },
  moveLesson: (id, b) => {
    const l = L(id), ls = lessonsOf(l.seriesId), i = ls.indexOf(l), j = i + (+b.dataset.d), o = ls[j];
    if (!o) return; [l.order, o.order] = [o.order, l.order]; save(true); render(); closeSheet();
  },
  moveToSeries: id => {
    const l = L(id);
    openSheet(`<h3>نقل إلى سلسلة</h3>${S.series.filter(s => s.id !== l.seriesId).map(s => `<button class="menu-item" data-act="moveTo" data-id="${id}" data-s="${s.id}"><span class="dot" style="width:10px;height:10px;border-radius:50%;background:${s.color}"></span> ${esc(s.title)}</button>`).join('')}`);
  },
  moveTo: (id, b) => {
    const l = L(id), sid = b.dataset.s;
    l.seriesId = sid; l.order = lessonsOf(sid).filter(x => x.id !== id).reduce((m, x) => Math.max(m, x.order), 0) + 1;
    save(true); closeSheet(); render(); toast('نُقل الدرس ✓');
  },
  copyLink: id => { closeSheet(); copyText(ytUrl(L(id).videoId), 'نُسخ الرابط ✓'); },
  delLesson: async id => {
    const l = L(id);
    const extra = (l.notes.length || l.clips.length) ? `سيُحذف معه ${l.notes.length} فائدة و${l.clips.length} مقطع.` : '';
    if (!(await ask('حذف هذا الدرس؟', 'حذف', true, extra))) return;
    if (cur === id) { try { YTP && YTP.stopVideo(); } catch (e) {} cur = null; S.last = null; closePlayer(); }
    S.lessons = S.lessons.filter(x => x.id !== id); save(true); render();
  },
  /* السلاسل */
  renameSeries: async id => { const s = SR(id); const v = await askText('اسم السلسلة', s.title); if (v) { s.title = v; save(true); render(); if (cur) renderPlayerHead(); } },
  seriesColor: (id, b) => { SR(id).color = b.dataset.c; save(true); render(); seriesMenu(id); },
  copySeriesNotes: id => { closeSheet(); const t = seriesNotesText(id); t ? copyText(t, 'نُسخت فوائد السلسلة ✓') : toast('لا فوائد في هذه السلسلة بعد'); },
  dlSeriesNotes: id => { const t = seriesNotesText(id); if (!t) { toast('لا فوائد في هذه السلسلة بعد'); return; } downloadFile('فوائد - ' + SR(id).title + '.txt', t); closeSheet(); },
  allDone: async id => { if (!(await ask('تعليم كل دروس السلسلة كمنتهية؟'))) return; lessonsOf(id).forEach(l => { l.done = true; l.doneAt = Date.now(); }); save(true); render(); },
  resetSeries: async id => { if (!(await ask('إعادة تعيين التقدّم في هذه السلسلة؟', 'إعادة تعيين', true, 'تبقى الفوائد والمقاطع كما هي.'))) return; lessonsOf(id).forEach(l => { l.done = false; l.pos = 0; l.doneAt = null; }); save(true); render(); },
  delSeries: async id => {
    const s = SR(id), n = lessonsOf(id).length;
    if (!(await ask(`حذف سلسلة «${s.title}»؟`, 'حذف نهائيًّا', true, `سيُحذف ${lessonsWord(n)} مع فوائدها ومقاطعها.`))) return;
    if (cur && L(cur) && L(cur).seriesId === id) { try { YTP && YTP.stopVideo(); } catch (e) {} cur = null; S.last = null; closePlayer(); }
    S.lessons = S.lessons.filter(l => l.seriesId !== id); S.series = S.series.filter(x => x.id !== id);
    save(true); go(''); toast('حُذفت السلسلة');
  },
  /* الإعدادات */
  setOpt: (_, b) => {
    const k = b.dataset.k; let v = b.dataset.v; if (/^\d+$/.test(v)) v = +v;
    S.settings[k] = v; save(true); applyTheme(); renderTools(); render();
    b.parentElement.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
  },
  toggleOpt: (_, b) => { const k = b.dataset.k; S.settings[k] = !S.settings[k]; b.classList.toggle('on', S.settings[k]); save(true); renderStage(); renderTools(); },
  exportDl: () => downloadFile('مكتبتي-الصوتية-' + todayKey() + '.json', JSON.stringify(S), 'application/json'),
  exportCopy: () => copyText(JSON.stringify(S), 'نُسخت النسخة الاحتياطية ✓ — احفظها في الملاحظات'),
  importPaste: () => {
    openSheet(`<h3>لصق نسخة احتياطية</h3><label class="fld"><textarea id="impTa" rows="6" dir="ltr" placeholder='{"v":1,...}'></textarea></label>
      <div class="sheet-actions"><button class="btn" data-act="sheetNo">إلغاء</button><button class="btn primary" data-act="importGo">استيراد</button></div>`);
  },
  importGo: () => { const t = $('#impTa').value; closeSheet(); importData(t); },
  wipeAll: async () => {
    if (!(await ask('حذف كل السلاسل والدروس والفوائد؟', 'حذف الكل', true, 'لا يمكن التراجع. صدّر نسخة احتياطية أولًا إن أردت.'))) return;
    try { YTP && YTP.stopVideo(); } catch (e) {}
    S = defaults(); cur = null; save(true); closePlayer(); applyTheme(); go(''); toast('حُذفت كل البيانات');
  }
};
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const f = A[b.dataset.act]; if (!f) return;
  if (b.tagName !== 'A' && b.tagName !== 'LABEL') e.preventDefault();
  e.stopPropagation();
  f(b.dataset.id, b, e);
});

/* ============ البدء ============ */
$('#fab').innerHTML = ic('plus', 28, 2.4);
$('#pClose').innerHTML = ic('down', 24);
$('#pMore').innerHTML = ic('more', 22);
$('#bPrev').innerHTML = ic('prev', 28);
$('#bNext').innerHTML = ic('next', 28);
applyTheme();
route();
if (cur) { renderPlayerAll(); ytReadyP.then(() => { if (cur && !YTP) { const l = L(cur); let st = l.pos || 0; if (l.duration && st > l.duration - 8) st = 0; createPlayer(l.videoId, st, false); } }); }
renderPlayState();
// إكمال العناوين التي لم تُجلب بعد
setTimeout(() => queueMeta(S.lessons.filter(l => !l.metaOk && l.titleAuto).map(l => l.id)), 2500);
</script>
